spring.application.name=M6_THERMAL_POWER_PLANT_API

# Nạp .env ở gốc repo — mỗi máy một giá trị, KHÔNG commit (xem .env.example).
# optional: = không có file .env cũng không lỗi lúc đọc.
# [.properties] = parse file theo định dạng key=value.
spring.config.import=optional:file:.env[.properties]

# DATABASE
# Mặc định trỏ MySQL localhost cho tiện; mật khẩu KHÔNG có mặc định — thiếu là
# app dừng ngay lúc khởi động với thông báo chỉ đúng tên biến.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/m6_thermal_power_plant?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# ddl-auto=validate: Flyway giờ SỞ HỮU schema (db/migration/*.sql). Hibernate chỉ
# đối chiếu entity <-> schema hiện có khi khởi động, KHÔNG tự sửa DB nữa — sửa
# schema phải qua migration mới (Vx__mo_ta.sql), không sửa tay/đổi entity suông.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CLOUDINARY — lưu trữ file/PDF (xem config/CloudinaryConfig).
# Mặc định RỖNG: ai không làm tính năng PDF vẫn boot app được, chỉ hỏng khi
# thật sự gọi upload. Điền vào .env nếu cần (lấy trong tin nhắn ghim của nhóm).
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dw0bha2qk}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# FLYWAY
# Migrations o src/main/resources/db/migration (mac dinh, khong can khai bao location).
# baseline-on-migrate: chi co tac dung khi schema DA CO SAN du lieu/bang nhung
# CHUA co bang flyway_schema_history (vd: dong nghiep khac dang dung ddl-auto=update
# cu, chua tung chay Flyway) -> Flyway "chap nhan" schema hien tai lam moc thay vi bao loi.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT
scms.jwt.base64-secret=${JWT_SECRET:eWVsbG93d29vZGVub3JnYW5pemVkZGlzdGFuY2Vkcml2aW5nbGVhZGJyYXNzYnJlYXQ=}
scms.jwt.access-token-expiration=900000
scms.jwt.refresh-token-expiration=604800000

# FILE UPLOAD — cho phép import Excel CCDC (mặc định 1MB hơi nhỏ)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MAIL (SMTP) — cần để ToolBorrowOverdueNotifier gửi email nhắc quá hạn
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ACTUATOR — loại mail indicator khỏi /actuator/health (ALB health check không nên
# phụ thuộc SMTP; mail DOWN từng khiến health trả 503 → ECS crash loop). Xem application-prod.
management.health.mail.enabled=false
